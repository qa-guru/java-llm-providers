name: live bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      OLLAMA_BOX2_URL: ${{ vars.OLLAMA_BOX2_URL }}
      OLLAMA_BOX2_BASIC: ${{ secrets.OLLAMA_BOX2_BASIC }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OLLAMA_CLOUD_KEY: ${{ secrets.OLLAMA_CLOUD_KEY }}
      YC_API_KEY: ${{ secrets.YC_API_KEY }}
      YC_MODEL_URI: ${{ vars.YC_MODEL_URI }}
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      SELECTEL_FMC_URL: ${{ vars.SELECTEL_FMC_URL }}
      SELECTEL_FMC_KEY: ${{ secrets.SELECTEL_FMC_KEY }}
      SELECTEL_FMC_MODEL: ${{ vars.SELECTEL_FMC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bench all configured providers
        run: ./gradlew bench --console=plain -Dout=bench-out/bench.md
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-out/bench.md
