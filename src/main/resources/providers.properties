# ============================================================================
# Провайдеры LLM для занятия. Порядок = порядок в таблице bench.
# Секретов в файле НЕТ: ${ENV_VAR} подставляется из окружения (или -D).
# Провайдер без ключа/URL не падает — строка уходит в skip с причиной.
# Цены usd*PerM — декларируем сами по прайсу (API стоимость не возвращает).
# ============================================================================

providers=ollama-local,ollama-box2,ollama-spike,openrouter-free,google-ai-studio,groq,deepseek,ollama-cloud,yandexgpt-lite,gigachat,selectel-fmc

# --- bench ---
bench.prompt=Напиши один JUnit5-тест на Selenide: открыть /login, ввести неверный пароль, проверить текст 'Wrong login or password'. Только код, без пояснений.
bench.system=You are a concise assistant for a QA engineer.

# ============================================================================
# 1. Ollama LOCAL — ноутбук студента. $0, но нужно железо. Стек курса.
# ============================================================================
provider.ollama-local.type=ollama
provider.ollama-local.url=http://localhost:11434
provider.ollama-local.model=qwen2.5-coder:7b
provider.ollama-local.usdInPerM=0
provider.ollama-local.usdOutPerM=0
provider.ollama-local.note=своё железо, данные не уходят

# ============================================================================
# 2. Ollama REMOTE — наша CPU-коробка Box2, nginx + basic auth. $0 за токены,
#    платим за сервер ~28 тыс ₽/мес (он и так наш, CI/Jenkins).
# ============================================================================
provider.ollama-box2.type=ollama
provider.ollama-box2.url=${OLLAMA_BOX2_URL}
provider.ollama-box2.basic=${OLLAMA_BOX2_BASIC}
provider.ollama-box2.model=qwen2.5-coder:7b
provider.ollama-box2.usdInPerM=0
provider.ollama-box2.usdOutPerM=0
provider.ollama-box2.note=наш dedicated CPU — медленно, зато своё

# ============================================================================
# 2.5 Ollama SPIKE — арендованная GPU на сутки (Selectel dedicated CL81G,
#     RTX 4090). Тот же type=ollama, но URL за nginx TLS + basic auth.
#     Заказ на паре: my.selectel.ru → Dedicated → 1-day plan ~1890 ₽/сутки.
# ============================================================================
provider.ollama-spike.type=ollama
provider.ollama-spike.url=${OLLAMA_SPIKE_URL}
provider.ollama-spike.basic=${OLLAMA_SPIKE_BASIC}
provider.ollama-spike.model=qwen2.5-coder:7b
provider.ollama-spike.usdInPerM=0
provider.ollama-spike.usdOutPerM=0
provider.ollama-spike.note=аренда ~1890 ₽/сутки — платим за железо, не токены

# ============================================================================
# 3. OpenRouter FREE — модели с суффиксом :free. Лимиты ~50 req/day,
#    регистрация → API key. Агрегатор 300+ моделей одним ключом.
# ============================================================================
provider.openrouter-free.type=openai
provider.openrouter-free.url=https://openrouter.ai/api
provider.openrouter-free.key=${OPENROUTER_API_KEY}
provider.openrouter-free.model=qwen/qwen3-4b:free
provider.openrouter-free.usdInPerM=0
provider.openrouter-free.usdOutPerM=0
provider.openrouter-free.note=free-лимиты, данные уходят в США

# ============================================================================
# 4. Google AI Studio — Gemini free tier (RPM-лимиты). OpenAI-compatible.
#    aistudio.google.com → Get API key. (GitHub Models закрыт 2026-07-30 —
#    free tier может умереть, урок тоже про это.)
# ============================================================================
provider.google-ai-studio.type=openai
provider.google-ai-studio.url=https://generativelanguage.googleapis.com/v1beta/openai
provider.google-ai-studio.key=${GOOGLE_API_KEY}
provider.google-ai-studio.model=gemini-2.5-flash-lite
provider.google-ai-studio.usdInPerM=0
provider.google-ai-studio.usdOutPerM=0
provider.google-ai-studio.note=free tier; данные в Google

# ============================================================================
# 5. Groq — free tier, быстрый inference на своих LPU. llama-3.1-8b-instant.
# ============================================================================
provider.groq.type=openai
provider.groq.url=https://api.groq.com/openai
provider.groq.key=${GROQ_API_KEY}
provider.groq.model=llama-3.1-8b-instant
provider.groq.usdInPerM=0.05
provider.groq.usdOutPerM=0.08
provider.groq.note=free tier; платно $0.05/0.08 — быстрее всех

# ============================================================================
# 6. DeepSeek direct — самый дешёвый сильный API. Баланс пополняется.
# ============================================================================
provider.deepseek.type=openai
provider.deepseek.url=https://api.deepseek.com
provider.deepseek.key=${DEEPSEEK_API_KEY}
provider.deepseek.model=deepseek-chat
provider.deepseek.usdInPerM=0.14
provider.deepseek.usdOutPerM=0.28
provider.deepseek.note=дешевле всех paid; данные в Китай

# ============================================================================
# 7. Ollama Cloud — те же модели, но на серверах Ollama. Free tier,
#    ollama.com → Settings → Keys → API key. OpenAI-compatible.
# ============================================================================
provider.ollama-cloud.type=openai
provider.ollama-cloud.url=https://ollama.com
provider.ollama-cloud.key=${OLLAMA_CLOUD_KEY}
provider.ollama-cloud.model=gpt-oss:120b-cloud
provider.ollama-cloud.usdInPerM=0
provider.ollama-cloud.usdOutPerM=0
provider.ollama-cloud.note=cloud у самой Ollama; gpt-oss/deepseek/qwen

# ============================================================================
# 8. YandexGPT Lite — РФ, 152-ФЗ, платежи в ₽. OpenAI-compatible endpoint.
#    Нужен API key сервис-аккаунта + folder id в model URI.
# ============================================================================
provider.yandexgpt-lite.type=openai
provider.yandexgpt-lite.url=https://llm.api.cloud.yandex.net
provider.yandexgpt-lite.key=${YC_API_KEY}
provider.yandexgpt-lite.model=${YC_MODEL_URI}
provider.yandexgpt-lite.usdInPerM=0.20
provider.yandexgpt-lite.usdOutPerM=0.40
provider.yandexgpt-lite.note=~200 ₽/1M lite; pro ~800 ₽/1M; РФ-периметр

# ============================================================================
# 9. GigaChat — Сбер. OpenAI-compatible /api/v1. Freemium 365M токенов/год.
#    Authorization key из личного кабинета developers.sber.ru.
# ============================================================================
provider.gigachat.type=openai
provider.gigachat.url=https://gigachat.devices.sberbank.ru/api/v1
provider.gigachat.key=${GIGACHAT_AUTH_KEY}
provider.gigachat.model=GigaChat-2
provider.gigachat.usdInPerM=0.65
provider.gigachat.usdOutPerM=0.65
provider.gigachat.note=65 ₽/1M lite; freemium пакет на год

# ============================================================================
# 10. Selectel Foundation Models Catalog — аренда inference-сервиса почасово:
#    платишь за GPU-ресурсы, endpoint OpenAI-compatible. Модель уже развёрнута.
# ============================================================================
provider.selectel-fmc.type=openai
provider.selectel-fmc.url=${SELECTEL_FMC_URL}
provider.selectel-fmc.key=${SELECTEL_FMC_KEY}
provider.selectel-fmc.model=${SELECTEL_FMC_MODEL}
provider.selectel-fmc.usdInPerM=0
provider.selectel-fmc.usdOutPerM=0
provider.selectel-fmc.note=платим за GPU/час, не за токены
